name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      VERSION: '4.0.3'
      SERVERPOD_PASSWORD_database: 'ci_test_db_password_1234567890'
      SERVERPOD_PASSWORD_redis: 'ci_test_redis_password_1234567890'
      SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper: 'ci_test_jwt_pepper_12345678901234567890'
      SERVERPOD_PASSWORD_jwtHmacSha512PrivateKey: 'ci_test_jwt_hmac_sha512_private_key_64_bytes_minimum_length_for_hmac_sha512_signing_key_1234567890'
      SERVERPOD_PASSWORD_emailSecretHashPepper: 'ci_test_email_secret_pepper_12345678901234567890'

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      # The test config sets `database.dataPath`, so the tests run against an
      # embedded PostgreSQL that Serverpod starts itself. No Docker needed.
      # The binaries are downloaded once and cached here between runs. The
      # bundle changes with the Serverpod version, so the version is in the key.
      - name: Cache embedded PostgreSQL binaries
        uses: actions/cache@v4.2.0
        with:
          path: ~/.cache/serverpod/pg-binaries
          key: serverpod-pg-binaries-${{runner.os}}-${{env.VERSION}}

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: |
          dart install serverpod_cli@$VERSION
          # `dart install` puts executables in the Dart data home, which is not
          # on the PATH of a GitHub runner.
          echo "${XDG_STATE_HOME:-$HOME/.local/state}/Dart/install/bin" >> "$GITHUB_PATH"

      - name: Run Serverpod generator
        working-directory: promise_server
        run: serverpod generate

      - name: Run tests
        working-directory: promise_server
        run: dart test -j 1
